<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volk Control</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --ink: #e6e9ef;
    --dim: #949cad;
    --ok: #3fb950;
    --off: #6e7681;
    --warn: #d29922;
    --bad: #f85149;
    --accent: #5865f2;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa; --panel: #ffffff; --line: #dfe3ec;
      --ink: #171a21; --dim: #5c6472;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 12px; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .dot.bad { background: var(--bad); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 11px; font-weight: 600; text-transform: uppercase;
             letter-spacing: .6px; color: var(--dim); }
  .card .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .v.small { font-size: 14px; font-weight: 500; word-break: break-all; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  button {
    font: inherit; font-weight: 550; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--dim); }
  button:disabled { opacity: .4; cursor: default; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.stop { color: var(--bad); }

  .guilds { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .guild { display: flex; align-items: center; gap: 10px; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .guild code { font-family: var(--mono); color: var(--dim); font-size: 12px; }
  .tag { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 99px;
         border: 1px solid var(--line); color: var(--dim); }
  .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin-bottom: 18px; }
  .split section { min-width: 0; }
  /* Capped and scrollable: the two lists fill at very different rates, and
     letting the longer one set the page height pushed the log off-screen. */
  .split .list { max-height: 210px; overflow-y: auto; }

  .item { display: flex; align-items: baseline; gap: 8px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
          font-size: 12.5px; margin-bottom: 5px; }
  .item + .item { margin-top: 0; }
  .item .scope { font-family: var(--mono); font-size: 11px; color: var(--warn); flex: none; }
  .item .msg { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .when { margin-left: auto; color: var(--dim); font-size: 11px; flex: none;
                font-variant-numeric: tabular-nums; }
  .item .times { flex: none; font-size: 11px; color: var(--bad); font-weight: 650; }
  .item.denied .scope { color: var(--bad); }
  .item code { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .guild .meta { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  .loghead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .loghead h2 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
  label.chk { margin-left: auto; color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

  #log {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    font-family: var(--mono); font-size: 12px; line-height: 1.65;
    height: 46vh; min-height: 260px; overflow-y: auto; padding: 10px 12px;
  }
  .row { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-word; }
  .row + .row { margin-top: 1px; }
  .t { color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }
  .row.err .m { color: var(--bad); }
  .row.sys .m { color: var(--accent); font-style: italic; }
  .empty { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="dot" id="dot"></span>
    <h1>Volk</h1>
    <span class="sub" id="sub">conectando ao supervisor…</span>
  </header>

  <div class="cards">
    <div class="card"><h2>Estado</h2><div class="v" id="c-state">—</div></div>
    <div class="card"><h2>No ar há</h2><div class="v" id="c-uptime">—</div></div>
    <div class="card"><h2>Conta Discord</h2><div class="v small" id="c-tag">—</div></div>
    <div class="card"><h2>PID</h2><div class="v" id="c-pid">—</div></div>
    <div class="card"><h2>Erros (sessão)</h2><div class="v" id="c-err">0</div></div>
  </div>

  <!-- Read from volk_db, so these survive a restart and cover the last 24h,
       unlike the counters above which only know this session. -->
  <div class="cards">
    <div class="card"><h2>Erros 24h</h2><div class="v" id="d-err">—</div></div>
    <div class="card"><h2>Cliques 24h</h2><div class="v" id="d-clicks">—</div></div>
    <div class="card"><h2>Operadores 24h</h2><div class="v" id="d-ops">—</div></div>
    <div class="card"><h2>Renders 24h</h2><div class="v" id="d-renders">—</div></div>
    <div class="card"><h2>Render típico</h2><div class="v" id="d-p50">—</div></div>
  </div>

  <div class="bar">
    <button class="go" id="b-start">Ligar</button>
    <button class="stop" id="b-stop">Desligar</button>
    <button id="b-restart">Reiniciar</button>
    <button id="b-clear">Limpar logs</button>
  </div>

  <div class="guilds" id="guilds"></div>

  <div class="split">
    <section>
      <div class="loghead"><h2>Falhas recentes (7 dias)</h2></div>
      <div class="list" id="errors"><div class="empty">nenhuma</div></div>
    </section>
    <section>
      <div class="loghead"><h2>Últimos cliques</h2></div>
      <div class="list" id="clicks"><div class="empty">nenhum ainda</div></div>
    </section>
  </div>

  <div class="loghead">
    <h2>Log ao vivo</h2>
    <span class="sub" id="dbpath"></span>
    <label class="chk"><input type="checkbox" id="follow" checked> acompanhar</label>
  </div>
  <div id="log"><div class="empty">sem linhas ainda</div></div>

</div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  let empty = true;

  const hhmmss = (ms) => {
    const s = Math.floor(ms / 1000);
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    return `${h}:${m}:${String(s % 60).padStart(2, "0")}`;
  };

  let startedAt = null;
  setInterval(() => {
    $("c-uptime").textContent = startedAt ? hhmmss(Date.now() - startedAt) : "—";
  }, 1000);

  const GUILD_TAG = {
    ok:          ["ok", "publicando"],
    unbound:     ["warn", "sem canal"],
    unreachable: ["bad", "canal inacessível"],
    failing:     ["bad", "falhando"],
  };

  function paint(s) {
    lastState = s;
    startedAt = s.startedAt;
    $("dot").className = "dot" + (s.running ? " on" : s.lastExit ? " bad" : "");
    $("c-state").textContent = s.running ? "no ar" : "parado";
    $("c-tag").textContent = s.tag ?? "—";
    $("c-pid").textContent = s.pid ?? "—";
    $("c-err").textContent = s.errors;
    $("c-err").style.color = s.errors ? "var(--bad)" : "";

    $("sub").textContent = s.running
      ? "supervisor no ar, bot rodando"
      : s.lastExit
        ? `parado (${s.lastExit.signal ?? "código " + s.lastExit.code})`
        : "supervisor no ar, bot parado";

    $("b-start").disabled = s.running;
    $("b-stop").disabled = !s.running;

    // The log says whether the panel is publishing; the database says what it
    // is publishing and whether anyone is using it. Union of both, keyed by id,
    // so a guild the bot has not reached yet this session still shows up with
    // its stored configuration.
    const box = $("guilds");
    box.innerHTML = "";
    const ids = new Set([...s.guilds.map((g) => g.id), ...dbGuilds.keys()]);

    for (const id of ids) {
      const live = s.guilds.find((g) => g.id === id);
      const db = dbGuilds.get(id);
      const [cls, text] = live ? (GUILD_TAG[live.state] ?? ["", live.state]) : ["", "sem contato"];

      const bits = [];
      if (db?.serverId) bits.push(`servidor <code>${escapeHtml(db.serverId)}</code>`);
      if (db?.layer) bits.push(escapeHtml(db.layer));
      if (db?.auto) bits.push(`auto ${db.auto}s`);
      if (db?.language) bits.push(db.language);
      if (db?.clicks24h) bits.push(`${db.clicks24h} cliques 24h`);
      if (db?.logChannelId) bits.push("log on");

      const el = document.createElement("div");
      el.className = "guild";
      el.innerHTML =
        `<span>${live?.channel ? "#" + escapeHtml(live.channel) : "<span class=\"empty\">nenhum canal</span>"}</span>` +
        `<code>${escapeHtml(id)}</code>` +
        (bits.length ? `<span class="meta">${bits.join(" · ")}</span>` : "") +
        `<span class="tag ${cls}">${escapeHtml(text)}</span>`;
      box.appendChild(el);
    }
  }

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function addLine(e) {
    if (empty) { log.innerHTML = ""; empty = false; }
    const at = new Date(e.at).toLocaleTimeString("pt-BR", { hour12: false });
    const row = document.createElement("div");
    row.className = "row " + e.stream;
    row.innerHTML = `<span class="t">${at}</span><span class="m">${escapeHtml(e.line)}</span>`;
    log.appendChild(row);
    while (log.children.length > 600) log.removeChild(log.firstChild);
    if ($("follow").checked) log.scrollTop = log.scrollHeight;
  }

  const post = (path) => fetch(path, { method: "POST" });
  $("b-start").onclick = () => post("/start");
  $("b-stop").onclick = () => post("/stop");
  $("b-restart").onclick = () => post("/restart");
  $("b-clear").onclick = () => { log.innerHTML = '<div class="empty">sem linhas ainda</div>'; empty = true; };

  // --- what the bot recorded, as opposed to what it printed -----------------

  const ago = (ms) => {
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return "agora";
    if (s < 3600) return `${Math.floor(s / 60)}min`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    return `${Math.floor(s / 86400)}d`;
  };

  const CLICK_LABEL = {
    flag: "confirmou objetivo", undo: "desfez", reset: "limpou",
    server: "trocou servidor", perspective: "trocou lado", refresh: "atualizou",
  };

  function fill(el, rows, render, empty) {
    el.innerHTML = rows.length
      ? rows.map(render).join("")
      : `<div class="empty">${empty}</div>`;
  }

  async function poll() {
    let d;
    try {
      d = await fetch("/inspect").then((r) => r.json());
    } catch {
      return; // supervisor down; the SSE handler already says so
    }

    const h = d.health;
    // A missing database is the normal state of a fresh clone, so the cards say
    // "—" rather than zero: no data and no activity are different things.
    $("d-err").textContent = h ? h.errors24h : "—";
    $("d-err").style.color = h?.errors24h ? "var(--bad)" : "";
    $("d-clicks").textContent = h ? h.clicks24h : "—";
    $("d-ops").textContent = h ? h.operators24h : "—";
    $("d-renders").textContent = h ? h.renders24h : "—";
    $("d-p50").textContent = h?.renderP50 != null ? `${(h.renderP50 / 1000).toFixed(1)}s` : "—";

    $("dbpath").textContent = d.db.present
      ? `${h?.events ?? 0} eventos registrados`
      : "sem banco ainda";

    fill($("errors"), d.errors, (e) =>
      `<div class="item">` +
        `<span class="scope">${escapeHtml(e.scope ?? "?")}</span>` +
        `<span class="msg" title="${escapeHtml(e.detail ?? "")}">${escapeHtml(e.detail ?? "")}</span>` +
        (e.n > 1 ? `<span class="times">${e.n}x</span>` : "") +
        `<span class="when">${ago(e.last_at)}</span>` +
      `</div>`, "nenhuma falha em 7 dias");

    fill($("clicks"), d.clicks, (c) =>
      `<div class="item${c.denied ? " denied" : ""}">` +
        `<span class="scope">${c.denied ? "negado" : "ok"}</span>` +
        `<span class="msg">${escapeHtml(CLICK_LABEL[c.action] ?? c.action)}` +
          (c.user_id ? ` <code>${escapeHtml(c.user_id)}</code>` : "") +
        `</span>` +
        `<span class="when">${ago(c.at)}</span>` +
      `</div>`, "ninguém usou o painel ainda");

    dbGuilds = new Map(d.guilds.map((g) => [g.id, g]));
    if (lastState) paint(lastState);
  }

  let dbGuilds = new Map();
  let lastState = null;
  poll();
  setInterval(poll, 5000);

  function connect() {
    const es = new EventSource("/events");
    es.addEventListener("state", (m) => paint(JSON.parse(m.data)));
    es.addEventListener("line", (m) => addLine(JSON.parse(m.data)));
    es.onerror = () => {
      $("sub").textContent = "supervisor fora do ar (feche a janela ou rode Volk.command de novo)";
      $("dot").className = "dot bad";
    };
  }
  connect();
</script>
</body>
</html>
