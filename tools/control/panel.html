<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volk Control</title>
<link rel="icon" href="/brand/icon.png">
<style>
  /* Palette sampled from the brand assets rather than chosen: #a31d30 is the
     wolf in the banner, #dfd9cd the warm off-white it is outlined in, and the
     greys are the banner's own near-black. The page is dark only: the assets
     are drawn on black and a light theme would have to fight them. */
  :root {
    --void:   #0d0d0d;
    --bg:     #141414;
    --panel:  #191919;
    --raised: #1f1f1f;
    --line:   #2a2a2a;
    --line-soft: #222;

    --carmine: #a31d30;
    --carmine-dim: #7a1624;
    --carmine-glow: rgba(163, 29, 48, .18);

    --ink:  #dfd9cd;
    --dim:  #8b857c;
    --dimmer: #5f5a54;

    --ok:   #5a8f4a;
    --warn: #b8862c;
    --bad:  #c4392f;

    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 48px; }

  /* --- banner ------------------------------------------------------------ */
  /* The banner carries the identity, so it leads. Cropped short and faded into
     the page so it frames the status line instead of competing with it. */
  .hero {
    position: relative;
    margin: 0 0 0;
    height: 112px;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
    background: var(--void);
  }
  /* Anchored right and mirrored: the wolf sits at the banner's left edge, so
     the title would land on top of its face. Flipped, the art reads as a crest
     on the far side and the words get clean, dark ground. */
  /* Scoped to the backdrop only: `.hero img` also matched the crest inside
     .title, which inherited position:absolute and landed under the wordmark. */
  .hero > img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: left center;
    transform: scaleX(-1);
    opacity: .55;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--void) 0%, rgba(13,13,13,.92) 30%, rgba(13,13,13,.45) 70%, rgba(13,13,13,.25) 100%);
  }
  .hero .title {
    position: absolute; left: 24px; top: 50%; transform: translateY(-50%); z-index: 2;
    display: flex; align-items: center; gap: 14px;
  }
  .hero .crest {
    width: 54px; height: 54px; border-radius: 50%; flex: none;
    border: 1px solid color-mix(in srgb, var(--carmine) 45%, transparent);
  }
  .hero h1 {
    margin: 0; font-size: 27px; font-weight: 700; line-height: 1;
    letter-spacing: 4px; text-transform: uppercase;
    text-shadow: 0 2px 14px rgba(0,0,0,.9);
  }
  .hero .kicker {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--carmine); font-weight: 700; margin-bottom: 5px;
    text-shadow: 0 1px 6px rgba(0,0,0,.9);
  }
  .hero .words { display: flex; flex-direction: column; }

  /* --- the one line that answers "is it fine?" --------------------------- */
  .verdict {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--dimmer);
    border-radius: 0 10px 10px 0;
    padding: 14px 18px;
    margin: 20px 0 18px;
  }
  .verdict.ok   { border-left-color: var(--ok); }
  .verdict.warn { border-left-color: var(--warn); }
  .verdict.bad  { border-left-color: var(--bad); background: linear-gradient(90deg, var(--carmine-glow), var(--panel) 40%); }

  .verdict .pulse {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--dimmer); flex: none;
  }
  .verdict.ok .pulse   { background: var(--ok);   box-shadow: 0 0 0 4px rgba(90,143,74,.15); animation: breathe 3s ease-in-out infinite; }
  .verdict.warn .pulse { background: var(--warn); box-shadow: 0 0 0 4px rgba(184,134,44,.15); }
  .verdict.bad .pulse  { background: var(--bad);  box-shadow: 0 0 0 4px rgba(196,57,47,.18); }
  @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  @media (prefers-reduced-motion: reduce) { .verdict.ok .pulse { animation: none } }

  .verdict .headline { font-size: 15px; font-weight: 600; }
  .verdict .detail { color: var(--dim); font-size: 13px; }
  .verdict .spacer { margin-left: auto; }

  /* --- controls ---------------------------------------------------------- */
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; font-size: 13px; font-weight: 600;
    color: var(--ink); background: var(--raised);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 15px; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  button:hover:not(:disabled) { border-color: var(--dim); background: #262626; }
  button:disabled { opacity: .35; cursor: default; }
  button.go { background: var(--carmine); border-color: var(--carmine); color: #fff; }
  button.go:hover:not(:disabled) { background: #b92338; border-color: #b92338; }
  button.ghost { background: transparent; }

  /* --- sections ---------------------------------------------------------- */
  h2.sec {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--dim);
    margin: 26px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  h2.sec .note { font-weight: 500; letter-spacing: .3px; text-transform: none;
                 color: var(--dimmer); font-size: 11px; }

  /* --- guild cards ------------------------------------------------------- */
  /* A guild is the unit that matters, so each gets a card carrying everything
     about it, instead of its facts being spread across a table and a list. */
  .guilds { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
  .g {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 15px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .g.trouble { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .g-top { display: flex; align-items: center; gap: 9px; }
  /* The guild's Discord icon. Fixed square so a card's height does not depend
     on whether the image loaded, and no-referrer above because this is a
     loopback page asking cdn.discordapp.com for an asset. */
  .g-icon {
    width: 28px; height: 28px; flex: none;
    border-radius: 8px; object-fit: cover;
    background: var(--bg); border: 1px solid var(--line);
  }
  .g-icon.ph {
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: .3px;
    color: var(--dim);
  }
  .g-id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .g-name {
    font-weight: 650; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .g-chan { font-size: 11.5px; color: var(--dim); font-family: var(--mono); }
  .g-chan.none { color: var(--dimmer); font-style: italic; }
  .pill {
    margin-left: auto; font-size: 10.5px; font-weight: 600;
    letter-spacing: .4px; text-transform: uppercase;
    padding: 3px 9px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .pill.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .pill.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 45%, transparent);
               background: rgba(196,57,47,.08); }

  /* The layer is the thing the panel exists to show, so it is the loudest
     line on the card, not another grey key/value pair. */
  .g-layer { font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .g-layer .none { color: var(--dimmer); font-style: italic; font-family: var(--sans); }
  .g-facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--dim); }
  .g-facts code { font-family: var(--mono); color: var(--dim); font-size: 11px; }
  .g-facts .use { color: var(--ink); }

  /* --- metric strip ------------------------------------------------------ */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
  .metric {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 11px 13px;
  }
  .metric .k { font-size: 10px; font-weight: 700; letter-spacing: .9px;
          text-transform: uppercase; color: var(--dimmer); margin-bottom: 3px; }
  .metric .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .metric .v.quiet { color: var(--dimmer); font-weight: 400; }
  .metric.alarm { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .metric.alarm .v { color: var(--bad); }
  .metric .sub { font-size: 10.5px; color: var(--dimmer); margin-top: 1px; }

  /* --- lists ------------------------------------------------------------- */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
  .cols > section { min-width: 0; }
  .list { max-height: 216px; overflow-y: auto; padding-right: 2px; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .row2 {
    display: flex; align-items: baseline; gap: 9px;
    background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: 7px; padding: 7px 11px; margin-bottom: 5px; font-size: 12.5px;
  }
  .row2 .scope {
    font-family: var(--mono); font-size: 10.5px; flex: none;
    color: var(--warn); text-transform: uppercase; letter-spacing: .3px;
  }
  .row2.err { border-left: 2px solid var(--carmine-dim); }
  .row2.err .scope { color: var(--carmine); }
  .row2 .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row2 .who { font-family: var(--mono); font-size: 10.5px; color: var(--dimmer); }
  .row2 .when { margin-left: auto; color: var(--dimmer); font-size: 10.5px;
                flex: none; font-variant-numeric: tabular-nums; }
  .row2 .times {
    flex: none; font-size: 10.5px; font-weight: 700; color: var(--bad);
    background: rgba(196,57,47,.12); padding: 1px 6px; border-radius: 99px;
  }
  .row2.denied .scope { color: var(--bad); }

  .empty { color: var(--dimmer); font-style: italic; font-size: 12.5px; padding: 8px 2px; }

  /* --- log --------------------------------------------------------------- */
  .loghead { display: flex; align-items: center; gap: 10px; }
  label.chk { margin-left: auto; color: var(--dim); font-size: 11.5px;
              display: flex; align-items: center; gap: 6px; cursor: pointer;
              font-weight: 400; letter-spacing: 0; text-transform: none; }
  #log {
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
    height: 26vh; min-height: 150px; max-height: 320px; overflow-y: auto; padding: 10px 13px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .ln { display: flex; gap: 11px; white-space: pre-wrap; word-break: break-word; }
  .ln .t { color: var(--dimmer); flex: none; font-variant-numeric: tabular-nums; }
  .ln.err .m { color: var(--bad); }
  .ln.sys .m { color: var(--carmine); font-style: italic; }
  .ln .m { color: var(--dim); }
  .ln.noise .m { color: var(--dimmer); }
  /* The bot's own lines are the signal; node's warnings and npm noise are not. */
  .ln.bot .m { color: var(--ink); }

  footer { margin-top: 22px; color: var(--dimmer); font-size: 11px;
           display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  footer code { font-family: var(--mono); }
</style>
</head>
<body>

<div class="hero">
  <img src="/brand/banner.png" alt="">
  <div class="title">
    <img class="crest" src="/brand/icon.png" alt="">
    <div class="words">
      <span class="kicker">Control</span>
      <h1>Volk</h1>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- The whole point of the page in one line: is it fine, and if not, why. -->
  <div class="verdict" id="verdict">
    <span class="pulse"></span>
    <div>
      <div class="headline" id="v-head">conectando ao supervisor…</div>
      <div class="detail" id="v-detail">—</div>
    </div>
    <div class="spacer"></div>
    <div class="bar">
      <button class="go" id="b-start">Ligar</button>
      <button id="b-stop">Desligar</button>
      <button id="b-restart">Reiniciar</button>
      <!-- The supervisor runs detached with no terminal window, so this is the
           only way to take it down. -->
      <button class="ghost" id="b-quit" title="Desliga o bot e o supervisor">Desligar tudo</button>
    </div>
  </div>

  <h2 class="sec">Guilds <span class="note" id="g-note"></span></h2>
  <div class="guilds" id="guilds"></div>

  <h2 class="sec">Atividade <span class="note">últimas 24 horas</span></h2>
  <div class="metrics" id="metrics"></div>

  <div class="cols">
    <section>
      <h2 class="sec">Falhas <span class="note">7 dias, agrupadas</span></h2>
      <div class="list" id="errors"><div class="empty">—</div></div>
    </section>
    <section>
      <h2 class="sec">Quem usou <span class="note">cliques recentes</span></h2>
      <div class="list" id="clicks"><div class="empty">—</div></div>
    </section>
  </div>

  <h2 class="sec loghead">
    Log ao vivo
    <label class="chk"><input type="checkbox" id="follow" checked> acompanhar</label>
  </h2>
  <div id="log"><div class="empty">sem linhas ainda</div></div>

  <footer>
    <span id="f-proc">—</span>
    <span id="f-db">—</span>
    <button class="ghost" id="b-clear" style="margin-left:auto;font-size:11px;padding:4px 10px">Limpar log</button>
  </footer>

</div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  let logEmpty = true;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const hhmmss = (ms) => {
    const s = Math.floor(ms / 1000);
    return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60]
      .map((n) => String(n).padStart(2, "0")).join(":");
  };

  const ago = (ms) => {
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return "agora";
    if (s < 3600) return `${Math.floor(s / 60)}min`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    return `${Math.floor(s / 86400)}d`;
  };

  let state = null;   // from the log (SSE)
  let data = null;    // from the database (polled)

  // --- uptime ticks on its own so the verdict line stays live between polls
  setInterval(() => {
    if (state?.running && state.startedAt) {
      $("f-proc").textContent = `pid ${state.pid} · no ar há ${hhmmss(Date.now() - state.startedAt)}`;
    }
  }, 1000);

  // --- the verdict -------------------------------------------------------
  /**
   * One sentence, in plain words, ranked by what would actually ruin the day:
   * the bot being down beats a guild failing, which beats an upstream blip.
   * Reading ten numbers to work this out was the old page's real failure.
   */
  function verdict() {
    const el = $("verdict");
    if (!state) return;

    if (!state.running) {
      el.className = "verdict";
      $("v-head").textContent = "Bot parado";
      $("v-detail").textContent = state.lastExit
        ? `saiu com ${state.lastExit.signal ?? "código " + state.lastExit.code} ${ago(state.lastExit.at)}`
        : "nada publicando no Discord";
      return;
    }

    const failing = (data?.guilds ?? []).filter((g) => g.trouble === "refresh" || g.trouble === "render");
    const offline = (data?.guilds ?? []).filter((g) => g.trouble === "offline" || g.trouble === "seeding");
    const errs = data?.health?.errors24h ?? 0;

    if (failing.length) {
      el.className = "verdict bad";
      $("v-head").textContent = `${failing.length} guild(s) falhando`;
      $("v-detail").textContent = "o painel não está atualizando onde importa — veja as falhas abaixo";
      return;
    }
    if (errs > 0) {
      el.className = "verdict warn";
      $("v-head").textContent = `No ar, com ${errs} erro(s) em 24h`;
      $("v-detail").textContent = "publicando normalmente, mas algo falhou no caminho";
      return;
    }
    el.className = "verdict ok";
    $("v-head").textContent = `No ar como ${state.tag ?? "…"}`;
    $("v-detail").textContent = offline.length
      ? `tudo certo — ${offline.length} servidor(es) vigiado(s) sem partida agora`
      : "nenhum erro nas últimas 24 horas";
  }

  // --- guild cards -------------------------------------------------------
  const PILL = {
    ok:          ["ok", "publicando"],
    unbound:     ["warn", "sem canal"],
    unreachable: ["bad", "canal inacessível"],
    failing:     ["bad", "falhando"],
  };

  function paintGuilds() {
    const box = $("guilds");
    const live = state?.guilds ?? [];
    const db = new Map((data?.guilds ?? []).map((g) => [g.id, g]));
    const ids = [...new Set([...live.map((g) => g.id), ...db.keys()])];

    $("g-note").textContent = ids.length ? `${ids.length} servidor(es) Discord` : "";

    if (!ids.length) {
      box.innerHTML = '<div class="empty">nenhuma guild conhecida ainda</div>';
      return;
    }

    box.innerHTML = ids.map((id) => {
      const l = live.find((g) => g.id === id);
      const d = db.get(id);
      const [cls, text] = l ? (PILL[l.state] ?? ["", l.state]) : ["", "sem contato"];
      // Only the bot's own failures make a card alarming. `offline` and
      // `seeding` mean the Squad server has no match on, which is the game's
      // normal state between rounds and says nothing about the bot's health.
      const bad = cls === "bad" || d?.trouble === "refresh" || d?.trouble === "render" || d?.trouble === "mount";

      const facts = [];
      if (d?.serverId) facts.push(`servidor <code>${esc(d.serverId)}</code>`);
      if (d?.auto) facts.push(`auto ${d.auto}s`);
      if (d?.language) facts.push(esc(d.language));
      if (d?.pinned) facts.push(`${d.pinned} fixado(s)`);
      if (d?.logChannelId) facts.push("log ligado");
      if (d?.clicks24h) facts.push(`<span class="use">${d.clicks24h} cliques 24h</span>`);

      // The guild's own name and icon, once the bot has mounted there. Before
      // that there is only the id, which is what this used to show and is
      // still the honest fallback. Initials stand in for a guild with no icon.
      const gname = d?.name || null;
      const initials = (gname ?? id)
        .split(/[\s-]+/).filter(Boolean).slice(0, 2)
        .map((w) => w[0]).join("").toUpperCase();
      const badge = d?.icon
        ? `<img class="g-icon" src="${esc(d.icon)}" alt="" referrerpolicy="no-referrer">`
        : `<span class="g-icon ph">${esc(initials)}</span>`;

      return `<div class="g${bad ? " trouble" : ""}">` +
        `<div class="g-top">` +
          badge +
          `<span class="g-id">` +
            `<span class="g-name">${esc(gname ?? "guild " + id)}</span>` +
            `<span class="g-chan${l?.channel ? "" : " none"}">` +
              (l?.channel ? "#" + esc(l.channel) : "sem canal") +
            `</span>` +
          `</span>` +
          `<span class="pill ${cls}">${esc(text)}</span>` +
        `</div>` +
        `<div class="g-layer">` +
          (d?.layer
            ? esc(d.layer) + (d.layerAt ? ` <span class="who">· ${ago(d.layerAt)}</span>` : "")
            : `<span class="none">${d?.trouble === "offline" ? "servidor sem partida" : "nenhum layer ainda"}</span>`) +
        `</div>` +
        (facts.length ? `<div class="g-facts">${facts.join("<span style='color:var(--line)'>·</span>")}</div>` : "") +
      `</div>`;
    }).join("");
  }

  // --- metrics -----------------------------------------------------------
  function paintMetrics() {
    const h = data?.health;
    const card = (k, v, opts = {}) =>
      `<div class="metric${opts.alarm ? " alarm" : ""}">` +
        `<div class="k">${k}</div>` +
        `<div class="v${opts.quiet ? " quiet" : ""}">${v}</div>` +
        (opts.sub ? `<div class="sub">${opts.sub}</div>` : "") +
      `</div>`;

    // "—" and "0" are different claims: no database at all versus nothing
    // happened. The old page showed 0 for both.
    const n = (x) => (h ? x : "—");
    const quiet = !h;

    $("metrics").innerHTML =
      card("Erros", n(h?.errors24h ?? 0), { alarm: (h?.errors24h ?? 0) > 0, quiet }) +
      card("Cliques", n(h?.clicks24h ?? 0), { quiet: quiet || !h?.clicks24h }) +
      card("Operadores", n(h?.operators24h ?? 0), { quiet: quiet || !h?.operators24h }) +
      card("Renders", n(h?.renders24h ?? 0), { quiet: quiet || !h?.renders24h }) +
      card("Render típico",
           h?.renderP50 != null ? (h.renderP50 / 1000).toFixed(1) + "s" : "—",
           { quiet: h?.renderP50 == null, sub: h?.renderP50 != null ? "mediana" : "" });
  }

  // --- lists -------------------------------------------------------------
  const CLICK_LABEL = {
    flag: "confirmou objetivo", undo: "desfez", reset: "limpou",
    server: "trocou servidor", perspective: "trocou lado", refresh: "atualizou",
  };

  function paintLists() {
    const errs = data?.errors ?? [];
    $("errors").innerHTML = errs.length
      ? errs.map((e) =>
          `<div class="row2 err">` +
            `<span class="scope">${esc(e.scope ?? "?")}</span>` +
            `<span class="msg" title="${esc(e.detail ?? "")}">${esc(e.detail ?? "")}</span>` +
            (e.n > 1 ? `<span class="times">${e.n}×</span>` : "") +
            `<span class="when">${ago(e.last_at)}</span>` +
          `</div>`).join("")
      : '<div class="empty">nenhuma falha em 7 dias</div>';

    const clicks = data?.clicks ?? [];
    $("clicks").innerHTML = clicks.length
      ? clicks.map((c) =>
          `<div class="row2${c.denied ? " denied" : ""}">` +
            `<span class="scope">${c.denied ? "negado" : "ok"}</span>` +
            `<span class="msg">${esc(CLICK_LABEL[c.action] ?? c.action)}</span>` +
            (c.user_id ? `<span class="who">${esc(c.user_id)}</span>` : "") +
            `<span class="when">${ago(c.at)}</span>` +
          `</div>`).join("")
      : '<div class="empty">ninguém usou o painel ainda</div>';
  }

  function paintFooter() {
    if (!state?.running) {
      $("f-proc").textContent = state?.lastExit ? "processo parado" : "processo parado";
    }
    $("f-db").textContent = data?.db?.present
      ? `${data.health?.events ?? 0} eventos · ${data.db.path.replace(/^.*\//, "")}`
      : "sem banco ainda";
  }

  const repaint = () => { verdict(); paintGuilds(); paintMetrics(); paintLists(); paintFooter(); };

  // --- sources -----------------------------------------------------------
  async function poll() {
    try {
      data = await fetch("/inspect").then((r) => r.json());
    } catch {
      return; // supervisor unreachable; the SSE handler already says so
    }
    repaint();
  }
  poll();
  setInterval(poll, 5000);

  function addLine(e) {
    if (logEmpty) { log.innerHTML = ""; logEmpty = false; }
    const at = new Date(e.at).toLocaleTimeString("pt-BR", { hour12: false });
    const isBot = /^\[(BOT|TELEMETRY|STORE)\]/.test(e.line);
    // Node writes its own warnings to stderr, so the stream alone would paint
    // "ExperimentalWarning: Importing JSON modules" in the same red as a real
    // failure. Everything the bot itself prints is tagged, so anything
    // untagged on stderr is the runtime talking, not the bot.
    const noise = e.stream === "err" && !isBot && /^\(node:\d+\)|^\(Use `node/.test(e.line);
    const el = document.createElement("div");
    el.className = "ln " + (noise ? "noise" : e.stream) + (isBot ? " bot" : "");
    el.innerHTML = `<span class="t">${at}</span><span class="m">${esc(e.line)}</span>`;
    log.appendChild(el);
    while (log.children.length > 600) log.removeChild(log.firstChild);
    if ($("follow").checked) log.scrollTop = log.scrollHeight;
  }

  const post = (p) => fetch(p, { method: "POST" });
  $("b-start").onclick = () => post("/start");
  $("b-stop").onclick = () => post("/stop");
  $("b-restart").onclick = () => post("/restart");

  /**
   * Quits the supervisor as well as the bot, which is the end of the service
   * until someone double-clicks Volk.command again. Confirmed because the
   * button sits next to three reversible ones and this one is not.
   */
  $("b-quit").onclick = async () => {
    if (!confirm("Desligar o bot e o supervisor? O painel para de responder até você abrir o Volk.command de novo.")) return;
    $("b-quit").disabled = true;
    // The reply arrives before the process goes, so the page is told to stop
    // pretending it still has a supervisor rather than waiting for a timeout.
    try { await post("/quit"); } catch {}
    down = true;
    $("verdict").className = "verdict";
    $("v-head").textContent = "Desligado";
    $("v-detail").textContent = "abra o Volk.command para subir de novo";
  };
  $("b-clear").onclick = () => {
    log.innerHTML = '<div class="empty">sem linhas ainda</div>';
    logEmpty = true;
  };

  /**
   * Keeps the stream up, and says so when it is not.
   *
   * EventSource reconnects on its own, but only while the server is answering;
   * if the supervisor is gone it retries quietly forever and the page just sits
   * there looking fine. So a failure is stated on screen, and the retry keeps
   * going so it recovers by itself once the supervisor is back.
   */
  let es = null;
  let down = false;

  function connect() {
    if (es) es.close();
    es = new EventSource("/events");

    es.onopen = () => {
      if (down) {
        down = false;
        poll();     // catch up on whatever happened while we were blind
        repaint();
      }
    };
    es.addEventListener("state", (m) => {
      state = JSON.parse(m.data);
      $("b-start").disabled = state.running;
      $("b-stop").disabled = !state.running;
      repaint();
    });
    es.addEventListener("line", (m) => addLine(JSON.parse(m.data)));

    es.onerror = () => {
      down = true;
      $("verdict").className = "verdict bad";
      $("v-head").textContent = "Sem contato com o supervisor";
      $("v-detail").textContent =
        "reconectando… se não voltar, abra o Volk.command (ou veja logs/panel.log)";
    };
  }
  connect();

  // EventSource gives up for good in some browsers after repeated failures, so
  // a dead stream is rebuilt rather than waited on.
  setInterval(() => {
    if (es && es.readyState === EventSource.CLOSED) connect();
  }, 10000);
</script>
</body>
</html>
